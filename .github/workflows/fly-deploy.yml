name: Fly Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-accent-ax-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy acent-ax-api
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly config
        run: flyctl config validate --app acent-ax-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --ha=false --app acent-ax-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://acent-ax-api.fly.dev/api/health; then
              exit 0
            fi
            echo "Health check failed, retrying (${attempt}/12)..."
            sleep 5
          done
          exit 1
